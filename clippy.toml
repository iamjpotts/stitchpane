# RUST-001: the panic lints set in Cargo.toml skip #[test] functions and #[cfg(test)]
# modules; test crates under tests/ allow them at their root instead
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-tests = true

# panic macros (RUST-001)
disallowed-macros = [
    { path = "std::assert", reason = "panics (RUST-001)" },
    { path = "std::assert_eq", reason = "panics (RUST-001)" },
    { path = "std::assert_ne", reason = "panics (RUST-001)" },
    { path = "std::debug_assert", reason = "panics (RUST-001)" },
    { path = "std::debug_assert_eq", reason = "panics (RUST-001)" },
    { path = "std::debug_assert_ne", reason = "panics (RUST-001)" },
    { path = "std::dbg", reason = "panics when stderr fails" },
]

# methods documented to panic, in std and dependencies, that have a fallible form or a
# panic-free workaround (RUST-001). Test code allows `disallowed_methods`.
disallowed-methods = [
    # std::cell: panics when already borrowed
    { path = "core::cell::RefCell::borrow", reason = "panics when borrowed; use try_borrow" },
    { path = "core::cell::RefCell::borrow_mut", reason = "panics when borrowed; use try_borrow_mut" },
    { path = "core::cell::RefCell::replace", reason = "panics when borrowed; use try_borrow_mut" },
    { path = "core::cell::RefCell::replace_with", reason = "panics when borrowed; use try_borrow_mut" },
