[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
description = "Spec-Driven Image Editor In Rust"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
repository = "https://github.com/iamjpotts/stitchpane"
rust-version = "1.99.1"
version = "0.1.1"

[workspace.lints.rust]
warnings = "deny"

# panic lints (RUST-001, decisions/0006-panic-safety.md); never remove, lower, or allow
# them in production code. Test crate roots allow them (see tests/features.rs).
[workspace.lints.clippy]
arithmetic_side_effects = "deny"
exit = "deny"
expect_used = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
# these suggest Result::ok, is_ok and is_err, which RUST-003 bans
manual_ok_err = "allow"
redundant_pattern_matching = "allow"

[workspace.dependencies]
cucumber = "0.23"
futures = "0.3"
gtk4 = { version = "0.11", features = ["v4_14"] }
iced = { version = "0.14", features = ["canvas", "image-without-codecs"] }
iced_test = "0.14"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
stitchpane-core = { path = "crates/stitchpane-core", version = "0.1.0" }
stitchpane-gtk = { path = "crates/stitchpane-gtk", version = "0.1.0" }
stitchpane-iced = { path = "crates/stitchpane-iced", version = "0.1.0" }
kamadak-exif = "0.6"
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
tiff = "0.11"
webp = { version = "0.3", default-features = false }
yaml_serde = "0.10"

# Image decoding and resampling are unusably slow without optimization.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# rendering runs per frame; keep the canvas responsive in dev builds (UI-009)
[profile.dev.package.stitchpane-core]
opt-level = 3
