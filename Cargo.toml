[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.99.1"
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]
cucumber = "0.23"
futures = "0.3"
gtk4 = "0.11"
iced = "0.14"
imaginer-core = { path = "crates/imaginer-core", version = "0.1.0" }
imaginer-gtk = { path = "crates/imaginer-gtk", version = "0.1.0" }
imaginer-iced = { path = "crates/imaginer-iced", version = "0.1.0" }
