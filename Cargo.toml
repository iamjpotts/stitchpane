[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.99.1"
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]
cucumber = "0.23"
futures = "0.3"
gtk4 = { version = "0.11", features = ["v4_14"] }
iced = { version = "0.14", features = ["canvas", "image-without-codecs"] }
iced_test = "0.14"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
stitchpane-core = { path = "crates/stitchpane-core", version = "0.1.0" }
stitchpane-gtk = { path = "crates/stitchpane-gtk", version = "0.1.0" }
stitchpane-iced = { path = "crates/stitchpane-iced", version = "0.1.0" }
kamadak-exif = "0.6"
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
tiff = "0.11"
webp = { version = "0.3", default-features = false }
yaml_serde = "0.10"

# Image decoding and resampling are unusably slow without optimization.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# rendering runs per frame; keep the canvas responsive in dev builds (UI-009)
[profile.dev.package.stitchpane-core]
opt-level = 3
